<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Manager (Onglets)</title>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: #131d31;
            --input-bg: #0b1323;
            --border-color: #1d2d4a;
            --primary-blue: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --console-bg: #070c14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }

        h1.title { text-align: center; color: #60a5fa; margin-bottom: 20px; font-size: 1.5rem; font-weight: 600; }

        /* Navigation Onglets */
        .tabs-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #1e293b; color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
        .tab-btn.active { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }

        /* Cartes & Panneaux */
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; color: var(--text-main); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Formulaires */
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        input, select { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: var(--primary-blue); }

        /* Description Box */
        .desc-box { background: var(--input-bg); border: 1px solid var(--border-color); border-left: 3px solid var(--primary-blue); border-radius: 4px; padding: 10px; font-size: 0.85rem; color: var(--text-muted); min-height: 45px; }

        /* Boutons d'action */
        .btn-action { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-action:hover { background: var(--primary-hover); }

        /* Console */
        .console-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-clear { background: #1e293b; border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        .console-box { background: var(--console-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; height: 140px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; line-height: 1.4; }
        .log-line { margin-bottom: 3px; }
        .log-time { color: #64748b; }
        .log-info { color: #94a3b8; }
        .log-success { color: #4ade80; }
        .log-warning { color: #fbbf24; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title">PS5 ELF & PKG Manager</h1>

    <!-- Onglets Haut -->
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('elf-tab', this)">ELF Sender</button>
        <button class="tab-btn" onclick="switchTab('pkg-tab', this)">PKG Sender</button>
        <button class="tab-btn" onclick="switchTab('config-tab', this)">Configuration</button>
    </div>

    <!-- Onglet 1 : ELF Sender -->
    <div id="elf-tab" class="tab-content active">
        <div class="card">
            <div class="card-title">Envoyer un Payload (ELF)</div>
            
            <div class="form-group">
                <label>Source des Payloads</label>
                <select id="elf-source-select"><option value="">Chargement...</option></select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>1. Catégorie</label>
                    <select id="elf-category-select">
                        <option value="all">-- Toutes les catégories --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>2. Payload (ELF)</label>
                    <select id="elf-select"><option value="">-- Sélectionnez --</option></select>
                </div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <div id="elf-desc" class="desc-box">Sélectionnez un payload pour voir sa description.</div>
            </div>

            <div class="form-group">
                <label>Port elfldr</label>
                <input type="text" id="elf-port" value="9021">
            </div>

            <button id="btn-send-elf" class="btn-action">Injecter l'ELF</button>
        </div>
    </div>

    <!-- Onglet 2 : PKG Sender -->
    <div id="pkg-tab" class="tab-content">
        <div class="card">
            <div class="card-title">Installer un Package (PKG)</div>
            
            <div class="form-group">
                <label>Source des Packages</label>
                <select id="pkg-source-select"><option value="">Chargement...</option></select>
            </div>

            <div class="form-group">
                <label>Sélectionner un fichier PKG</label>
                <select id="pkg-select"><option value="">-- Sélectionnez --</option></select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <div id="pkg-desc" class="desc-box">Sélectionnez un package pour voir sa description.</div>
            </div>

            <div class="form-group">
                <label>Port Direct PKG Installer</label>
                <input type="text" id="pkg-port" value="12800">
            </div>

            <button id="btn-send-pkg" class="btn-action">Installer le PKG</button>
        </div>
    </div>

    <!-- Onglet 3 : Configuration -->
    <div id="config-tab" class="tab-content">
        <div class="card">
            <div class="card-title">Configuration PS5</div>
            <div class="form-group">
                <label>Adresse IP de la console PS5</label>
                <input type="text" id="ps5-ip" placeholder="ex: 192.168.1.50">
            </div>
        </div>
    </div>

    <!-- Console de statut (Fixe en bas) -->
    <div class="card">
        <div class="console-header">
            <div class="card-title" style="margin:0;">Console de statut</div>
            <button class="btn-clear" onclick="clearConsole()">Effacer</button>
        </div>
        <div id="status-console" class="console-box"></div>
    </div>
</div>

<script>
    // Navigation onglets
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // Gestion de la console de logs
    function log(msg, type = 'info') {
        const consoleBox = document.getElementById('status-console');
        if (!consoleBox) return;
        const time = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
        consoleBox.appendChild(line);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function clearConsole() {
        document.getElementById('status-console').innerHTML = '';
    }
</script>

<script src="elf.js"></script>
<script src="pkg.js"></script>
</body>
</html>
