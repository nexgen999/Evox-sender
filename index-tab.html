<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Evox-sender | Tabs</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #333; border: none; color: white; cursor: pointer; }
        .tab-btn.active { background: #007bff; }
        .tab-content { display: none; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        .tab-content.active { display: block; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; background: #2a2a2a; color: white; border: 1px solid #444; }
        #log { background: #000; color: #0f0; padding: 10px; font-family: monospace; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Evox-sender</h2>

    <!-- Config commune aux deux -->
    <input type="text" id="ps5-ip" placeholder="IP de la PS5">

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('elf-tab')">ELF</button>
        <button class="tab-btn" onclick="showTab('pkg-tab')">PKG</button>
    </div>

    <!-- ELF Tab -->
    <div id="elf-tab" class="tab-content active">
        <input type="number" id="elf-port" value="9021">
        <select id="elf-source-select"></select>
        <select id="elf-select"></select>
        <button id="btn-send-elf">Injecter l'ELF</button>
    </div>

    <!-- PKG Tab -->
    <div id="pkg-tab" class="tab-content">
        <input type="number" id="pkg-port" value="12800">
        <select id="pkg-source-select"></select>
        <select id="pkg-select"></select>
        <button id="btn-send-pkg">Installer le PKG</button>
    </div>

    <div id="log">Log console...</div>
</div>

<script>
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }
    
    function log(msg) {
        document.getElementById('log').innerHTML += `<div>${msg}</div>`;
    }
</script>
<script src="elf.js"></script>
<script src="pkg.js"></script>
</body>
</html>
