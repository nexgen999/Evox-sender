<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Evox-sender | Global</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #333; border-radius: 5px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; }
        button { cursor: pointer; background: #007bff; border: none; font-weight: bold; }
        button:hover { background: #0056b3; }
        #log { background: #000; color: #0f0; padding: 10px; font-family: monospace; height: 100px; overflow-y: scroll; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Evox-sender</h2>

    <!-- Configuration -->
    <div class="section">
        <h3>Configuration PS5</h3>
        <input type="text" id="ps5-ip" placeholder="IP de la PS5 (ex: 192.168.1.50)">
    </div>

    <!-- ELF Manager -->
    <div class="section">
        <h3>ELF Manager</h3>
        <input type="number" id="elf-port" value="9021">
        <select id="elf-source-select"></select>
        <select id="elf-select"></select>
        <button id="btn-send-elf">Injecter l'ELF</button>
    </div>

    <!-- PKG Manager -->
    <div class="section">
        <h3>PKG Manager</h3>
        <input type="number" id="pkg-port" value="12800">
        <select id="pkg-source-select"></select>
        <select id="pkg-select"></select>
        <button id="btn-send-pkg">Installer le PKG</button>
    </div>

    <div id="log">Log console...</div>
</div>

<script>
    function log(msg, type) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }
</script>
<script src="elf.js"></script>
<script src="pkg.js"></script>
</body>
</html>
